<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenBlock</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            width: 320px;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header p {
            margin: 5px 0 0;
            font-size: 12px;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .setting-info {
            display: flex;
            flex-direction: column;
        }
        .setting-title {
            font-size: 15px;
            font-weight: 600;
        }
        .setting-desc {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--success);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ZenBlock</h1>
        <p>Ultra-Light Adblocker</p>
    </div>
    
    <div class="content">
        <div class="setting-item">
            <div class="setting-info">
                <span class="setting-title">Block Ads & Trackers</span>
                <span class="setting-desc">Blocks annoying banners & YouTube ads</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleAds">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <span class="setting-title">Block NSFW Content</span>
                <span class="setting-desc">Safe browsing (Adult sites blocked)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleNsfw">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="footer">
        Powered by MV3 Declarative Net Request<br>
        Fast, Private, Lightweight
    </div>

    <script src="popup.js"></script>
    <p id="rulesetError" style="margin:8px 12px 0;color:#f85149;font-size:11px;line-height:1.4"></p>
</body>
</html>
